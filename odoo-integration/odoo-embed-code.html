<!--
  HOW TO ADD TO ODOO WEBSITE:
  ----------------------------
  Option A (Recommended for all pages):
  1. Log in to your Odoo admin account.
  2. Go to: Website -> Configuration -> Settings.
  3. Scroll down to the "Custom Code" or "HTML Code" section.
  4. Paste this code into "Header Code" or "Body Code".
  5. Click "Save".

  Option B (Using Odoo Page Builder):
  1. Open your Odoo website homepage.
  2. Click the "Edit" button in top right.
  3. Search for the "Embed Code" or "</> HTML" building block in the sidebar.
  4. Drag and drop it into the footer of your website.
  5. Click on the block, paste this snippet, and click "Save".
