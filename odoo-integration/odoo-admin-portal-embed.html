<!-- 
  ========================================================================
  LiveAgent Admin Portal - Odoo Website Integration Snippet
  ========================================================================
  Use this code to embed the Live Agent Admin Dashboard directly inside 
  your Odoo Website (e.g., on a private page like /support-desk or /admin-chat).

  Replace 'YOUR_BACKEND_URL' with your hosted backend link:
  - Local Testing:  http://localhost:3000/admin
  - Hosted Online:  https://your-backend.onrender.com/admin
-->

<div id="odoo-liveagent-wrapper" style="width: 100%; height: calc(100vh - 110px); min-height: 650px; background: #faf8ff; padding: 0; margin: 0; position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(124, 58, 237, 0.08); border: 1px solid #ddd6fe;">
  
  <!-- Loading Placeholder -->
  <div id="liveagent-loading" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; color: #7c3aed; font-family: sans-serif; z-index: 1;">
    <div style="width: 44px; height: 44px; border: 4px solid #ede9fe; border-top-color: #7c3aed; border-radius: 50%; animation: odoo-spin 0.9s linear infinite; margin-bottom: 14px;"></div>
    <p style="font-weight: 600; font-size: 15px; margin: 0;">Connecting to LiveAgent Portal...</p>
    <p style="font-size: 13px; color: #6b7280; margin-top: 4px;">Make it a good day!</p>
  </div>

  <!-- Admin Portal Responsive Frame -->
  <iframe 
    id="liveagent-admin-frame"
    src="YOUR_BACKEND_URL/admin" 
    style="width: 100%; height: 100%; border: none; display: block;"
    allow="autoplay; microphone"
    onload="document.getElementById('liveagent-loading').style.display = 'none';"
    title="LiveAgent Support Portal">
  </iframe>

</div>

<style>
  @keyframes odoo-spin {
    to { transform: rotate(360deg); }
  }
</style>
